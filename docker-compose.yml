services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Idepitech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Idepitech}
      POSTGRES_DB: ${POSTGRES_DB:-Idepitech}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: DOCKERFILE
    image: idepitech-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-Idepitech}
    ports:
     - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: DOCKERFILE
    image: idepitech-frontend
    restart: unless-stopped
    ports:
    - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: